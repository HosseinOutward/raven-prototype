 0 a8 8 0 1 0 -16 0 Z"/><path fill="#000" d="M80 76 L130 106 L164 160 L124 202 L40 226 Z"/></svg></g><text x="624.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="682.667" y="548" width="32" height="32" preserveAspectRatio="xMidYMid meet"><path fill="#000" fill-rule="evenodd" d="M84 66 L120 40 L214 70 L134 96 Z M116 60 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z"/><path fill="#000" d="M80 76 L130 106 L164 160 L124 202 L40 226 Z"/></svg></g><text x="698.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">32px</text><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="740.667" y="564" width="16" height="16" preserveAspectRatio="xMidYMid meet"><path fill="#000" fill-rule="evenodd" d="M84 66 L120 40 L214 70 L134 96 Z M116 60 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z"/><path fill="#000" d="M80 76 L130 106 L164 160 L124 202 L40 226 Z"/></svg></g><text x="748.667" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="592.6666666666667" y="636" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">B · Folded raven</text><text x="592.6666666666667" y="670" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">Two folded planes, head and body: precise,</text><text x="592.6666666666667" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">a little cyberpunk, grows from today&#x27;s</text><text x="592.6666666666667" y="722" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" 