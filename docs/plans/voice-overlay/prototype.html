<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--text-secondary:#a29d94;--surface-1:#26231f;--border-stronger:#77736b;color-scheme:dark}
body{margin:0;padding:24px;background:#141311;color:#ece9e2;font-family:system-ui,sans-serif;max-width:720px}
p.note{font-size:13px;color:#a29d94;line-height:1.5}
button{font:inherit;color:inherit;background:transparent;border:1px solid #4a4640;border-radius:8px;padding:4px 10px;cursor:pointer}
.scr{position:relative;height:300px;border-radius:12px;overflow:hidden;background:#1f2924;margin-top:1rem}
.scr:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#25302b 0 18px,#202a25 18px 36px)}
.card{position:absolute;left:14px;top:14px;background:rgba(14,13,12,.72);border-radius:12px;padding:6px;color:#ece9e2;font-size:12px;transition:background .15s,width .2s}
.card.on{background:rgba(22,21,20,.95);outline:1px solid rgba(255,255,255,.09)}
.row{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 3px;border-radius:8px;min-height:30px;animation:in .18s ease-out}
.card.on .row.p:hover{background:rgba(255,255,255,.06)}
@keyframes in{from{opacity:0;transform:translateY(-3px)}}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#f2efe9;flex:none;transition:box-shadow .14s}
.av.s{box-shadow:0 0 0 2px rgba(14,13,12,.9),0 0 0 4px #6fcabb}
.nm{white-space:nowrap;transition:color .6s}
.st{margin-left:auto;display:flex;gap:4px;align-items:center;padding-left:8px;white-space:nowrap}
.red{color:#e0766d}.amb{color:#e9b35a}.sub{color:#a29d94}
.hr{height:1px;background:rgba(255,255,255,.08);margin:4px 2px}
.bar{display:flex;gap:4px;margin-top:6px}
.bar button{flex:1;height:28px;border:0;border-radius:7px;background:rgba(255,255,255,.07);color:#ece9e2;font-size:12px;padding:0 8px;white-space:nowrap}
.bar button.x{background:rgba(224,118,109,.2);color:#e0766d}
.vol{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin:0 6px 4px 35px}
.vol i{display:block;height:100%;background:#ece9e2;border-radius:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:13px;color:var(--text-secondary)}
.seg{display:inline-flex;gap:2px}
.seg button{font-size:13px;padding:4px 10px}
.seg button.a{background:var(--surface-1);border-color:var(--border-stronger)}
.strip{display:flex;gap:3px;padding:3px 3px 4px}
.strip .av{width:20px;height:20px;font-size:11px;position:relative}
.strip .av i{position:absolute;right:-5px;bottom:-4px;font-size:11px}
</style>
</head>
<body>
<p class="note">Voice overlay prototype approved on 2026-10-26 (docs/plans/voice-overlay). Speakers are simulated. Hover the card to interact; scroll on a person to change their volume. Colours approximate Raven's tokens; the real build uses the tokens.</p>
<div class="scr"><div class="card" id="card"></div></div>
<div class="ctl">
 <span>View</span><span class="seg" id="mode"><button data-v="all" class="a">Everyone</button><button data-v="focus">Talkers first</button><button data-v="only">Only talking</button></span>
 <span>Shape</span><span class="seg" id="shape"><button data-v="col" class="a">Column</button><button data-v="row">Row</button></span>
</div>
<div class="ctl">
 <label><input type="checkbox" id="linger" checked> Keep name a moment after talking</label>
 <button id="talk">Hold to talk (you)</button>
</div>
<script>
const P=[{id:"mi",n:"Mina",c:"#6a5b8c"},{id:"ar",n:"Arash",c:"#4d6b5a"},{id:"ka",n:"Kaveh",c:"#7a5a48",weak:1},{id:"na",n:"Nazanin",c:"#5b5b5b",muted:1},{id:"sa",n:"Sara",c:"#3f5a78",away:1}];
const me={n:"You",c:"#8a6a3a",muted:false,deaf:false,away:false,talking:false};
let mode="all",shape="col",hover=false,linger=true;const last={},vol={};P.forEach(p=>{last[p.id]=0;vol[p.id]=100});const speaking=new Set();
const card=document.getElementById("card");
function av(p,s){return `<div class="av${s?' s':''}" style="background:${p.c}">${p.n.slice(0,2).toUpperCase()}</div>`}
function recent(p){return linger&&!speaking.has(p.id)&&Date.now()-last[p.id]<3000}
function status(p){if(p.muted)return '<i class="ti ti-microphone-off red" aria-label="Muted"></i>';if(p.weak)return '<i class="ti ti-antenna-bars-2 amb" aria-label="Weak connection"></i>';if(p.away)return '<span class="sub">Back in a bit</span>';return ''}
function prow(p){const s=speaking.has(p.id),r=recent(p);const col=s?'#f6f3ee':(mode==="all"?'#d6d1c8':(r?'#a29d94':'#d6d1c8'));
 return `<div class="row p" data-id="${p.id}">${av(p,s)}<span class="nm" style="color:${col}">${p.n}</span><span class="st">${hover&&vol[p.id]!==100?`<span class="sub">${vol[p.id]}%</span>`:''}${status(p)}</span></div>`+(hover&&vol[p.id]!==100?`<div class="vol"><i style="width:${vol[p.id]/2}%"></i></div>`:'')}
function merow(){let st='';if(me.deaf)st='<i class="ti ti-headphones-off red"></i><span class="red">Deafened</span>';else if(me.muted)st=me.talking?'<i class="ti ti-microphone-off red"></i><span class="red" style="font-weight:500">You\'re muted</span>':'<i class="ti ti-microphone-off red"></i>';else if(me.away)st='<span class="sub">Back in a bit</span>';
 return `<div class="row">${av(me,me.talking&&!me.muted&&!me.deaf)}<span class="nm">You</span><span class="st">${st}</span></div>`}
function bar(){return hover?`<div class="bar"><button id="bm" class="${me.muted?'x':''}" aria-label="Mute"><i class="ti ti-microphone${me.muted?'-off':''}"></i></button><button id="bd" class="${me.deaf?'x':''}" aria-label="Deafen"><i class="ti ti-headphones${me.deaf?'-off':''}"></i></button><button id="ba" style="flex:3">${me.away?'I\'m back':'Back in a bit'}</button></div>`:''}
function render(){let h='';
 if(shape==="col"){card.style.width="196px";
  if(mode==="all")h=P.map(prow).join('');
  else{const act=P.filter(p=>speaking.has(p.id)||recent(p));h=act.map(prow).join('');
   if(mode==="focus"){const q=P.filter(p=>!act.includes(p));if(q.length)h+=`<div class="strip">${q.map(p=>`<div class="av" style="background:${p.c}" title="${p.n}">${p.n[0]}${p.muted?'<i class="ti ti-microphone-off red"></i>':''}</div>`).join('')}</div>`}
   else if(!act.length)h+=`<div class="row sub" style="padding-left:8px">${P.length} others here</div>`}
  h+='<div class="hr"></div>'+merow()+bar();
 }else{card.style.width="auto";
  const list=mode==="only"?P.filter(p=>speaking.has(p.id)||recent(p)):P;
  h='<div style="display:flex;align-items:center;gap:6px">'+`<div style="display:flex;align-items:center;gap:6px;padding:2px 4px 2px 2px">${av(me,me.talking&&!me.muted&&!me.deaf)}${me.muted||me.deaf?`<i class="ti ti-${me.deaf?'headphones':'microphone'}-off red"></i>${me.talking&&me.muted?'<span class="red" style="font-weight:500">You\'re muted</span>':''}`:''}</div><div style="width:1px;height:20px;background:rgba(255,255,255,.12)"></div>`+
   list.map(p=>{const s=speaking.has(p.id),r=recent(p);return `<div class="row p" data-id="${p.id}" style="padding:2px ${s||r?'8px':'2px'} 2px 2px;gap:6px">${av(p,s)}${s||r?`<span class="nm" style="color:${s?'#f6f3ee':'#a29d94'}">${p.n}</span>`:''}${p.muted?'<i class="ti ti-microphone-off red"></i>':''}</div>`}).join('')+'</div>'+(hover?bar().replace('class="bar"','class="bar" style="margin-top:6px;max-width:220px"'):'');}
 card.className="card"+(hover?" on":"");card.innerHTML=h}
card.addEventListener("mouseenter",()=>{hover=true;render()});card.addEventListener("mouseleave",()=>{hover=false;render()});
card.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="bm")me.muted=!me.muted;if(b.id==="bd")me.deaf=!me.deaf;if(b.id==="ba")me.away=!me.away;render()});
card.addEventListener("wheel",e=>{const r=e.target.closest(".row.p");if(!r||!hover)return;e.preventDefault();const id=r.dataset.id;vol[id]=Math.max(0,Math.min(200,vol[id]+(e.deltaY<0?10:-10)));render()},{passive:false});
function seg(id,set){document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle("a",x===b));set(b.dataset.v);render()})}
seg("mode",v=>mode=v);seg("shape",v=>shape=v);
document.getElementById("linger").addEventListener("change",e=>{linger=e.target.checked;render()});
const t=document.getElementById("talk");t.addEventListener("pointerdown",()=>{me.talking=true;render()});["pointerup","pointerleave"].forEach(ev=>t.addEventListener(ev,()=>{me.talking=false;render()}));
setInterval(()=>{const cand=P.filter(p=>!p.muted&&!p.away);cand.forEach(p=>{if(speaking.has(p.id)){if(Math.random()<.35){speaking.delete(p.id);last[p.id]=Date.now()}}else if(speaking.size<2&&Math.random()<.12)speaking.add(p.id)});render()},600);
render();
</script>
</body>
</html>
