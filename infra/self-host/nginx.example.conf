# Example nginx config for a Raven server, one vhost per name (see docs/self-hosting.md).
# Replace the three example.org names, then run certbot --nginx for each.
# The containers listen on 127.0.0.1 only, so this proxy must run on the same machine.

server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name raven.example.org;

    # Full chat image variants are capped at 10 MiB by the API.
    client_max_body_size 12m;

    # Live update stream (server-sent events). It must reach the client as it is written:
    # buffering would hold presence and room changes back until a buffer filled. The API
    # sends a keepalive comment every 15 s, well inside the read timeout.
    location = /v1/nest-events {
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The admin API is reachable only through the dashboard's host (the third server block), which
    # has its own password in front of it. Here it does not exist.
    location /v1/admin/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name rtc.example.org;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://127.0.0.1:7880;
    }
}

# Raven admin dashboard (apps/admin).
#
# Two locks: this host asks for a password before anything is served, and the dashboard
# then needs a Raven administrator to sign in. Only the parts of the API the dashboard
# uses are passed through; everything else answers 404.
server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name admin.example.org;

    add_header Cache-Control "no-store" always;

    auth_basic "Raven admin";
    # Create it with: htpasswd -c /etc/nginx/raven.htpasswd <name>
    auth_basic_user_file /etc/nginx/raven.htpasswd;

    location ~ ^/v1/(admin|auth|media)/ {
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # The edge password is for the edge. The API signs people in with its own header.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        client_max_body_size 12m;
    }

    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
