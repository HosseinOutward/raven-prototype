services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: raven
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - raven_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U raven -d raven
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - raven_internal

  api:
    build:
      context: ../..
      dockerfile: infra/homelab/api.Dockerfile
    restart: unless-stopped
    environment:
      RAVEN_API_ADDR: 0.0.0.0:6977
      RAVEN_DATABASE_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: raven
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SSLMODE: disable
      RAVEN_VERSION: ${RAVEN_VERSION:?RAVEN_VERSION is required}
      RAVEN_PROTOCOL_VERSION: ${RAVEN_PROTOCOL_VERSION:-1}
      RAVEN_MINIMUM_CLIENT_VERSION: ${RAVEN_MINIMUM_CLIENT_VERSION:?RAVEN_MINIMUM_CLIENT_VERSION is required}
      RAVEN_RECOMMENDED_CLIENT_VERSION: ${RAVEN_RECOMMENDED_CLIENT_VERSION:?RAVEN_RECOMMENDED_CLIENT_VERSION is required}
      RAVEN_REQUIRED_CLIENT_CAPABILITIES: ${RAVEN_REQUIRED_CLIENT_CAPABILITIES:-}
      RAVEN_SERVER_NAME: ${RAVEN_SERVER_NAME:-Raven}
      RAVEN_SERVER_DESCRIPTION: ${RAVEN_SERVER_DESCRIPTION:-Raven closed alpha}
      RAVEN_ADVERTISE_URL: https://mimir.rvn.bluehour.cloud
      RAVEN_UPDATE_PUBLIC_URL: https://downloads.rvn.bluehour.cloud
      RAVEN_UPDATE_CONSENT_VERSION: closed-alpha-2026-07-12
      RAVEN_UPDATE_PRESIGN_SECONDS: ${RAVEN_UPDATE_PRESIGN_SECONDS:-600}
      RAVEN_CORS_ALLOWED_ORIGINS: https://ops.rvn.bluehour.cloud
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:6977/healthz
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      raven_internal: {}
      proxy:
        aliases:
          - raven-api

  operations:
    build:
      context: ../..
      dockerfile: infra/homelab/operations.Dockerfile
      args:
        VITE_RAVEN_OPERATIONS_API_URL: https://ops.rvn.bluehour.cloud
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      proxy:
        aliases:
          - raven-operations

volumes:
  raven_postgres:

networks:
  raven_internal:
  proxy:
    external: true
    name: proxy
