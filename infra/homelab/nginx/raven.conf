server {
    listen 80;
    server_name updates.rvn.bluehour.cloud;

    access_log /var/log/nginx/raven-updates.access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;

    location = /healthz {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    location = /v1/server/compatibility {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    location ^~ /v1/updates/artifacts/ {
        access_log off;
        return 404;
    }

    location ^~ /v1/updates/ {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name downloads.rvn.bluehour.cloud;

    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/raven-downloads.access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;

    location = /healthz {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    location ^~ /v1/updates/artifacts/ {
        access_log off;
        limit_except GET {
            deny all;
        }
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name ops.rvn.bluehour.cloud;

    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/raven-ops.access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;
    set $raven_operations raven-operations:80;

    auth_basic "Raven operations";
    auth_basic_user_file /etc/nginx/conf.d/raven/.ops.htpasswd;

    location /v1/ {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location / {
        proxy_pass http://$raven_operations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
